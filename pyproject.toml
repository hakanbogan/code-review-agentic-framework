[tool.poetry]
name = "code-review-agentic-framework"
version = "0.1.0"
description = "Multi-agent code review framework using CrewAI - Master's Thesis Project"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
crewai = "^1.6.1"
crewai-tools = "^1.6.1"
pydantic = "^2.12.5"
pydantic-settings = "^2.12.0"
typer = {extras = ["all"], version = "^0.20.0"}
rich = "^14.2.0"
python-dotenv = "^1.2.1"
gitpython = "^3.1.45"
numpy = "^1.26.4"
scipy = "^1.16.3"
pandas = "^2.3.3"
openai = "^2.8.1"
langchain-openai = "^1.1.0"
langchain-anthropic = "^1.3.0"
requests = "^2.32.5"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
pytest-cov = "^7.0.0"
pytest-asyncio = "^1.3.0"
pytest-mock = "^3.15.1"
ruff = "^0.14.7"
mypy = "^1.19.0"

[tool.poetry.group.tools]
optional = true

[tool.poetry.group.tools.dependencies]
semgrep = "^1.79.0"
bandit = {extras = ["toml"], version = "^1.9.2"}

[tool.poetry.scripts]
code-review = "app.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=. --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/venv/*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
