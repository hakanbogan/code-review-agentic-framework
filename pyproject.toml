[tool.poetry]
name = "code-review-agentic-framework"
version = "0.1.0"
description = "Multi-agent code review framework using CrewAI - Master's Thesis Project"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
license = "MIT"
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"
crewai = "^0.80.0"
crewai-tools = "^0.12.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
typer = {extras = ["all"], version = "^0.12.0"}
rich = "^13.7.0"
python-dotenv = "^1.0.0"
gitpython = "^3.1.40"
numpy = "^1.26.0"
scipy = "^1.11.0"
pandas = "^2.1.0"
openai = "^1.51.0"
langchain-openai = "^0.2.0"
requests = "^2.32.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
pytest-mock = "^3.12.0"
ruff = "^0.6.0"
mypy = "^1.7.0"
black = "^23.11.0"
isort = "^5.12.0"

[tool.poetry.group.tools]
optional = true

[tool.poetry.group.tools.dependencies]
semgrep = "^1.50.0"
bandit = {extras = ["toml"], version = "^1.7.5"}

[tool.poetry.scripts]
code-review = "app.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=. --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/venv/*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

